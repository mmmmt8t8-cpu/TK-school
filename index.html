<style>
:root{--bg:#06130e;--card:#0c2a1f;--card2:#0f3526;--line:#1d5a40;--g:#23a874;--g2:#5fd6a3;--gold:#d8b25a;--tx:#e8f5ee;--mu:#9bbfad;--red:#e0645c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal',Tahoma,Arial,sans-serif;line-height:1.6}
header{background:linear-gradient(135deg,#0a3a28,#06130e);border-bottom:2px solid var(--gold);padding:18px 16px;text-align:center}
header h1{margin:0;font-size:22px;color:var(--gold)}header p{margin:4px 0 0;color:var(--mu);font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#081f16;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{flex:0 0 auto;background:var(--card);color:var(--tx);border:1px solid var(--line);padding:8px 16px;border-radius:20px;font:inherit;cursor:pointer}
nav button.on{background:var(--g);border-color:var(--g2);font-weight:700}
main{max-width:1150px;margin:0 auto;padding:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
input,select,textarea{background:#08201a;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;max-width:100%}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;font-weight:700}
.btn.o{background:transparent;border:1px solid var(--g2);color:var(--g2)}.btn.r{background:var(--red)}.btn.s{padding:4px 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;border-top:3px solid var(--g)}
.card.su{border-top-color:var(--gold)}
.card h3{margin:0 0 6px;font-size:17px}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:10px;background:var(--card2);color:var(--g2);margin-left:4px}
.tag.su{color:var(--gold)}.tag.ok{background:#14573b;color:#fff}.tag.late{background:#6b2a26;color:#fff}
.row{font-size:14px;color:var(--mu);margin:3px 0}.row b{color:var(--tx)}
.pb{height:9px;background:#08201a;border-radius:6px;overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--g2))}
.acts{display:flex;gap:6px;margin-top:8px}
table{width:100%;border-collapse:collapse;background:var(--card);font-size:14px}
th{background:#0a3a28;color:var(--gold);position:sticky}th,td{border:1px solid var(--line);padding:7px 8px;text-align:right}
.wrap{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}.kpi b{display:block;font-size:26px;color:var(--g2)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.br{display:grid;grid-template-columns:150px 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--g);border-radius:14px;width:min(560px,94vw);padding:16px}
dialog::backdrop{background:#000a}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f label{display:flex;flex-direction:column;font-size:13px;color:var(--mu);gap:2px}.f .w{grid-column:1/3}
textarea{width:100%;min-height:300px}
@media(max-width:560px){.br{grid-template-columns:100px 1fr 40px}.f{grid-template-columns:1fr}.f .w{grid-column:1}}
@media print{nav,.bar,.acts,header p{display:none}body{background:#fff;color:#000}.card,table,.panel,.kpi{background:#fff;color:#000;border-color:#999}th{background:#eee;color:#000}.row,.row b{color:#000}}
</style>

<header><h1>الخطة التشغيلية المدرسية 1448هـ</h1><p>مجمع الأمير متعب بن عبدالعزيز التعليمي – إدارة التعليم بمنطقة الرياض – مدير المدرسة: تركي بليهيد المطيري</p></header>

<script>
var KEY='plan1448v1';
var seed=[
["انطلاقة واثقة",1,1,"أول متوسط وأول ثانوي","التوجيه الطلابي","رضا 90% من الطلاب الجدد"],
["حضوري يصنع نجاحي",1,3,"المتوسطة والثانوية","وكلاء شؤون الطلاب","خفض الغياب غير المبرر 20%"],
["حياة متوازنة",1,5,"المتوسطة والثانوية","الإرشاد الصحي","مشاركة 70% ووعي صحي 85%"],
["مختبر الابتكار",1,7,"المتوسطة والثانوية","منسق الموهوبين","ترشيح 20 طالباً و10 نماذج ابتكارية"],
["نحو القمة (نافس)",1,0,"المتوسطة","معلمو المواد المستهدفة","تحسن النتائج المرحلية 20%"],
["جيل AI",2,10,"المتوسطة والثانوية","معلمو المهارات الرقمية","إنتاج مشاريع رقمية واجتياز 80%"],
["English Challenge",1,11,"المتوسطة والثانوية","معلمو اللغة الإنجليزية","ارتفاع المهارات الأساسية 70%"],
["المواطن الرقمي",1,13,"المتوسطة والثانوية","المعلم المكلف بالبرنامج","وعي رقمي 85%"],
["مدرستي آمنة",1,15,"المتوسطة","التوجيه الطلابي","شعور بالأمان 90%"],
["واعي وآمن",1,17,"المتوسطة والثانوية","منسق الأمن والسلامة","فرضية إخلاء وتدريب 80%"],
["أثر",2,0,"المتوسطة والثانوية","مسؤول التطوع","توثيق ساعات العمل التطوعي"],
["قارئ المستقبل",2,2,"المتوسطة","معلمو اللغة العربية","تحسن اختبار نافس القرائي 20%"],
["معلم المستقبل",2,4,"الهيئة التعليمية","الشؤون التعليمية","لقاءات مهنية وأثر لدى 80% من المعلمين"],
["مستقبلي يبدأ الآن",2,6,"المرحلة الثانوية","محمد العتيبي","90% من الصف الثالث لديهم خطة"],
["شركاء النجاح",2,8,"أولياء الأمور","إدارة المدرسة","مشاركة 60% من الأسر"],
["قدراتي تصنع مستقبلي",2,12,"المرحلة الثانوية","معلمو المواد المستهدفة","مشاركة 90% وتحسن المتوسط 10%"],
["قيم تصنع الفرق",2,14,"المتوسطة والثانوية","التوجيه الطلابي","السلوك الإيجابي 90%"],
["قادة المستقبل",2,16,"المتوسطة والثانوية","رائد النشاط","تأهيل 30 قائداً وتنفيذ 6 مبادرات"],
["بوابة الجامعة",2,17,"الصف الثالث الثانوي","الشؤون التعليمية","تحسن النتائج التجريبية 10%"]
];
var sus=[["مدرستي خضراء (ترشيد الكهرباء والمياه)","مسؤول الأمن والسلامة"],["التدوير وفرز النفايات","رائد النشاط"],["حديقة المدرسة والتشجير","التربية الفنية"]];
var S=load();
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}
var p=seed.map(function(x,i){return{id:i+1,name:x[0],type:'تشغيلي',sem:x[1],week:x[2],date:'',resp:x[4],group:x[3],ind:x[5],pct:0,before:'',after:'',st:'لم يبدأ',notes:''}});
sus.forEach(function(x,i){p.push({id:100+i,name:x[0],type:'استدامة',sem:2,week:0,date:'',resp:x[1],group:'جميع الطلاب',ind:'مبادرة مستدامة قابلة للقياس',pct:0,before:'',after:'',st:'لم يبدأ',notes:''})});
return{p:p,s1:'',s2:'',tab:'cards',q:'',fs:'all'}}
function save(){
if(!window.tkIsAdmin || !window.tkCloudReady)return;
try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
if(window.tkCloudReady){clearTimeout(window.tkSaveTimer);window.tkSaveTimer=setTimeout(function(){
window.tkDoc.set({state:JSON.parse(JSON.stringify(S)),updatedAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(function(err){alert('تعذر حفظ التغييرات في Firebase: '+err.message)})
},500)}
}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dt(p){if(p.date)return new Date(p.date+'T12:00:00');var s=p.sem==1?S.s1:S.s2;if(!s||!p.week)return null;var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+(p.week-1)*7);return d}
function fm(d,o){return d.toLocaleDateString('ar-SA',o)}
function dinfo(p){var d=dt(p);if(!d)return p.week?'حدّد بداية الفصل أو التاريخ':'طوال العام الدراسي';
return fm(d,{weekday:'long'})+' – '+fm(d,{day:'numeric',month:'long',year:'numeric',calendar:'gregory'})+' م – '+fm(d,{day:'numeric',month:'long',year:'numeric',calendar:'islamic-umalqura'})}
function late(p){var d=dt(p);return d&&p.st!=='منفذ'&&d<new Date()}
function list(){var q=S.q.trim();return S.p.filter(function(p){return(S.fs==='all'||String(p.sem)===S.fs||p.type===S.fs)&&(!q||(p.name+p.resp+p.group).indexOf(q)>-1)})}
var tabs=[['home','لوحة المؤشرات'],['about','الإحصائيات والبيانات'],['vision','الرؤية والرسالة والقيم'],['swot','تشخيص الواقع SWOT'],['frame','المنطلقات والأهداف والقضايا'],['db','قاعدة البيانات الرقمية'],['cards','البرامج والشواهد'],['table','الجدول الزمني'],['track','المتابعة والمساءلة'],['impact','قياس الأثر والتحليل'],['improve','المعالجة والتحسين'],['sus','الاستدامة'],['parents','أولياء الأمور'],['sat','رضا المستفيدين والاستبانة'],['tools','الأدوات والتصدير'],['report','التقرير الختامي']];
function render(){
document.getElementById('nav').innerHTML=tabs.map(function(t){return'<button data-t="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('');
var m=document.getElementById('main');
var bar='<div class="bar"><input id="q" placeholder="بحث باسم البرنامج أو المسؤول" value="'+esc(S.q)+'"><select id="fs"><option value="all">الكل</option><option value="1">الفصل الأول</option><option value="2">الفصل الثاني</option><option value="استدامة">الاستدامة</option></select><button class="btn" id="add">+ إضافة برنامج</button><button class="btn o" id="set">تواريخ الفصلين</button><button class="btn o" id="pr">طباعة / PDF</button></div>';
if(S.tab==='cards'||S.tab==='sus'){var L=list().filter(function(p){return S.tab!=='sus'||p.type==='استدامة'});
m.innerHTML=bar+(S.tab==='sus'?susPanel():'')+'<div class="grid">'+(L.map(card).join('')||'<p>لا توجد برامج.</p>')+'</div>'}
else if(S.tab==='table'){var L2=list().slice().sort(function(a,b){return a.sem-b.sem||(a.week||99)-(b.week||99)});
m.innerHTML=bar+'<div class="wrap"><table><tr><th>م</th><th>اسم البرنامج</th><th>النوع</th><th>اليوم والتاريخ</th><th>المسؤول عن التنفيذ</th><th>الحالة</th></tr>'+L2.map(function(p,i){return'<tr><td>'+(i+1)+'</td><td>'+esc(p.name)+'</td><td>'+p.type+'</td><td>'+dinfo(p)+'</td><td>'+esc(p.resp)+'</td><td>'+(late(p)?'متأخر':p.st)+'</td></tr>'}).join('')+'</table></div>'}
else if(S.tab==='impact')m.innerHTML=impact()+aiBox();
else if(V[S.tab])m.innerHTML=V[S.tab]();
else m.innerHTML=parents();
var f=document.getElementById('fs');if(f)f.value=S.fs;
}
function card(p){var su=p.type==='استدامة';return'<div class="card'+(su?' su':'')+'"><h3>'+esc(p.name)+'</h3><span class="tag'+(su?' su':'')+'">'+p.type+'</span><span class="tag">ف'+p.sem+(p.week?' – أسبوع '+p.week:'')+'</span><span class="tag '+(p.st==='منفذ'?'ok':late(p)?'late':'')+'">'+(late(p)?'متأخر':p.st)+'</span>'
+'<div class="row">📅 <b>'+dinfo(p)+'</b></div><div class="row">👤 المسؤول: <b>'+esc(p.resp)+'</b></div><div class="row">🎯 الفئة: '+esc(p.group)+'</div><div class="row">📊 المؤشر: '+esc(p.ind)+'</div>'
+'<div class="pb"><i style="width:'+p.pct+'%"></i></div><div class="row">الإنجاز: <b>'+p.pct+'%</b> · '+(p.ok||'لم يحدد التحقق')+'</div>'+evs(p)+'<div class="acts"><button class="btn s" data-e="'+p.id+'">تعديل</button><button class="btn s r" data-d="'+p.id+'">حذف</button></div></div>'}
function avg(a){return a.length?Math.round(a.reduce(function(x,y){return x+y},0)/a.length):0}
function impact(){var P=S.p,done=P.filter(function(p){return p.st==='منفذ'}).length,lt=P.filter(late).length,ing=P.filter(function(p){return p.st==='جارٍ'}).length;
var gains=P.filter(function(p){return p.before!==''&&p.after!==''}).map(function(p){return Number(p.after)-Number(p.before)});
var s=P.slice().sort(function(a,b){return b.pct-a.pct}),top=s.slice(0,3).filter(function(p){return p.pct>0}),low=P.filter(function(p){return p.pct<50&&p.st!=='لم يبدأ'}).slice(0,3);
var ts=['تشغيلي','استدامة'].map(function(t){var a=P.filter(function(p){return p.type===t});return t+': '+avg(a.map(function(p){return p.pct}))+'%'}).join(' | ');
return'<div class="kpis"><div class="kpi"><b>'+P.length+'</b>إجمالي البرامج</div><div class="kpi"><b>'+done+'</b>منفذ</div><div class="kpi"><b>'+ing+'</b>جارٍ</div><div class="kpi"><b>'+lt+'</b>متأخر</div><div class="kpi"><b>'+avg(P.map(function(p){return p.pct}))+'%</b>متوسط الإنجاز</div><div class="kpi"><b>'+(gains.length?(avg(gains)>0?'+':'')+avg(gains):'—')+'</b>متوسط الأثر (بعدي − قبلي)</div></div>'
+'<div class="panel"><h3>التحليل التلقائي</h3><p>'+(done+ing===0?'لم يبدأ تسجيل الإنجاز بعد؛ حدّث البرامج بالنسب والقياس القبلي والبعدي لتظهر التحليلات.':'نُفّذ '+done+' من '+P.length+' برنامجاً ('+Math.round(done*100/P.length)+'%)، ومتوسط الإنجاز '+avg(P.map(function(p){return p.pct}))+'%. '+ts+'.')+'</p>'
+(top.length?'<p>🟢 الأقوى أداءً: '+top.map(function(p){return esc(p.name)+' ('+p.pct+'%)'}).join('، ')+'</p>':'')
+(low.length?'<p>🔴 تحتاج معالجة: '+low.map(function(p){return esc(p.name)+' ('+p.pct+'%)'}).join('، ')+'</p>':'')
+(lt?'<p>⚠️ برامج تجاوزت موعدها ولم تُنفّذ: '+P.filter(late).map(function(p){return esc(p.name)}).join('، ')+'</p>':'')+'</div>'
+'<div class="panel"><h3>الإنجاز لكل برنامج</h3>'+P.map(function(p){return'<div class="br"><span>'+esc(p.name)+'</span><div class="pb"><i style="width:'+p.pct+'%"></i></div><b>'+p.pct+'%</b></div>'}).join('')+'</div>'}
function parents(){var P=S.p,up=P.filter(function(p){return p.st!=='منفذ'&&p.week}).slice(0,6),dn=P.filter(function(p){return p.st==='منفذ'});
var t='السلام عليكم ورحمة الله وبركاته\nعزيزي ولي الأمر، يسرّنا إطلاعكم على تقرير الخطة التشغيلية 1448هـ – مجمع الأمير متعب بن عبدالعزيز التعليمي.\n\n';
t+='✅ البرامج المنفذة ('+dn.length+'):\n'+(dn.map(function(p){return'• '+p.name+' – الإنجاز '+p.pct+'%'+(p.before!==''&&p.after!==''?' (أثر: '+(p.after-p.before>0?'+':'')+(p.after-p.before)+')':'')}).join('\n')||'• لا توجد بعد')+'\n\n';
t+='📅 البرامج القادمة:\n'+(up.map(function(p){return'• '+p.name+' – '+dinfo(p)+' – المسؤول: '+p.resp}).join('\n')||'• —')+'\n\n';
t+='📈 متوسط إنجاز الخطة: '+avg(P.map(function(p){return p.pct}))+'%\nشراكتكم أساس نجاح أبنائنا، شاكرين لكم تعاونكم.\nمدير المدرسة: تركي بليهيد المطيري';
return'<div class="panel"><h3>تقرير أولياء الأمور</h3><p class="row">عدّل النص كما تشاء ثم انسخه أو أرسله عبر واتساب.</p><textarea id="rep">'+esc(t)+'</textarea><div class="acts"><button class="btn" id="wa">إرسال واتساب</button><button class="btn o" data-ai="par">✨ صياغة بالذكاء الاصطناعي</button><button class="btn o" id="cp">نسخ النص</button><button class="btn o" id="pr">طباعة / PDF</button></div></div>'}
function T(h,r){return'<div class="wrap"><table><tr>'+h.map(function(x){return'<th>'+x+'</th>'}).join('')+'</tr>'+r.map(function(x){return'<tr>'+x.map(function(c){return'<td>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>'}
function P_(t,b){return'<div class="panel"><h3>'+t+'</h3>'+b+'</div>'}

function pcsv(t){t=t.replace(/^\ufeff/,'');var r=[],w=[],f='',q=false;for(var i=0;i<t.length;i++){var c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){w.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;w.push(f);r.push(w);w=[];f=''}else f+=c}if(f!==''||w.length){w.push(f);r.push(w)}return r.filter(function(x){return x.join('').trim()})}
function impRes(g,text){var r=pcsv(text),h=r[0]||[],rows=r.slice(1),q=[],c=[];h.forEach(function(t,j){if(/الطابع الزمني|timestamp|اسم|name|mail|بريد|جوال|هاتف|phone/i.test(t))return;var v=rows.map(function(x){return(x[j]||'').trim()}).filter(Boolean),nums=v.map(function(s){return parseFloat(s.replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632}))}).filter(function(x){return x>=1&&x<=5});if(v.length&&nums.length/v.length>=0.6)q.push({t:t,cnt:nums.length,avg:nums.reduce(function(s,x){return s+x},0)/nums.length});else v.forEach(function(s){if(c.length<300)c.push(s)})});S.rs=S.rs||{};S.rs[g]={n:rows.length,d:new Date().toLocaleDateString('ar-SA'),q:q,c:c};save();render()}

V.sat=function(){var R=S.rs||{},gs=Object.keys(QS),all=[],tot=0;gs.forEach(function(g){if(R[g]){tot+=R[g].n;R[g].q.forEach(function(x){all.push(x.avg*20)})}});
var h='<div class="kpis">'+gs.map(function(g){return'<div class="kpi"><b>'+(R[g]?R[g].n:0)+'</b>ردود '+g+'</div>'}).join('')+'<div class="kpi"><b>'+tot+'</b>إجمالي الردود</div><div class="kpi"><b>'+(all.length?avg(all)+'%':'—')+'</b>الرضا العام</div></div>';
h+=P_('رابط الاستبانة والباركود','<ol class="row"><li>أنشئ استبانة في Google Forms أو Microsoft Forms بدون جمع الأسماء أو الإيميلات (أسئلة الرضا الجاهزة بالأسفل).</li><li>الصق رابط الاستبانة هنا ليتولد الباركود، ثم اطبعه أو أرسله لأولياء الأمور.</li><li>بعد وصول الردود صدّرها CSV واستوردها في الأسفل: تظهر الأعداد والنتائج هنا دون أي أسماء.</li></ol><div class="bar"><input id="ql" style="flex:1;min-width:220px" placeholder="https://forms.gle/..." value="'+esc(S.ql)+'"><button class="btn" data-qr="1">توليد الباركود</button></div><div id="qrbox" style="background:#fff;padding:10px;display:inline-block;border-radius:8px;min-width:220px;min-height:20px"></div>');
h+=P_('استيراد الردود (بدون أسماء)','<div class="bar"><select id="rg">'+gs.map(function(g){return'<option>'+g+'</option>'}).join('')+'</select><label class="btn o">اختيار ملف CSV<input type="file" id="rf" accept=".csv" hidden></label></div><p class="row">يُحتسب عدد الردود ومتوسط كل سؤال (1–5) وتُجمع الآراء النصية. لا تُحفظ الصفوف الأصلية، وتُتجاهل أعمدة الاسم والبريد والجوال. استيراد ملف جديد لنفس الفئة يستبدل السابق.</p>');
h+=P_('رضا المستفيد: المعلم والطالب وولي الأمر',gs.map(function(g){return R[g]&&R[g].q.length?pbar(g+' ('+R[g].n+' رد)',avg(R[g].q.map(function(x){return x.avg*20}))):pbar(g+' (لا ردود)',0)}).join(''));
gs.forEach(function(g){var d=R[g];if(!d)return;h+=P_('نتائج '+g+' – '+d.n+' رد ('+esc(d.d)+')',d.q.map(function(x){return pbar(x.t+' ('+x.avg.toFixed(1)+'/5)',x.avg*20)}).join('')+(d.c.length?'<details><summary class="row">الآراء والمقترحات ('+d.c.length+')</summary>'+UL(d.c)+'</details>':''))});
h+=P_('أسئلة جاهزة للنسخ إلى النموذج (مقياس 1–5)',gs.map(function(g){return'<details><summary class="row">'+g+'</summary>'+UL(QS[g].concat(['ما مقترحاتك لتحسين المدرسة؟ (سؤال مفتوح)']))+'</details>'}).join(''));
setTimeout(drawQR,0);return h};
